name: CI — check + test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # LOAD-BEARING — do not remove this to "speed up CI".
      # `src/routeTree.gen.ts` is gitignored and is generated only by the
      # `tanstackStart()` plugin in vite.config.ts. Nothing else produces it:
      # vitest.config.ts does not load that plugin, there is no router CLI in
      # node_modules/.bin, and package.json has no prepare/postinstall hook.
      # So on a fresh checkout the file does not exist and BOTH gates below
      # fail: `pnpm check` dies with `TS2307: Cannot find module
      # '~/routeTree.gen'` (plus ~12 route type errors), and `pnpm test` fails
      # test/routes/legacy-sheet-redirect.test.ts and
      # test/routes/onboarding-auth-redirect.test.ts.
      # This build exists to generate that file, not to verify the bundle, and
      # it costs ~5s. If you ever make the route tree a committed artifact,
      # this step can go.
      - run: pnpm build
      - run: pnpm check
      # NOTE: no DATABASE_URL on purpose. 128 DB-gated tests are skipped by
      # design in this broad lane. The focused job below runs the required FAQ
      # transaction suite against a fresh disposable Postgres service.
      - run: pnpm test

  my-world-faq-database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: my_world_faq_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d my_world_faq_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply every migration to an empty database
        run: pnpm db:migrate
        env:
          DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/my_world_faq_ci
      - name: Run required FAQ database guarantees
        run: pnpm test:faq-db
        env:
          REQUIRE_DB_TESTS: "1"
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/my_world_faq_ci
